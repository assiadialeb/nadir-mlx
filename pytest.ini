[pytest]
DJANGO_SETTINGS_MODULE = mlx_orchestrator.settings
python_files = test_*.py
python_classes = *Tests Test*
python_functions = test_*
markers =
    contract: OpenAPI contract tests for gateway endpoints (coverage matrix ✅).
    smoke: Live gateway smoke tests; require NADIR_SMOKE_GATEWAY_URL.
    sdk: Official openai/anthropic/ollama client smokes against mocked gateway (MLX-121).
    golden: Benchmark golden snapshot regression checks (MLX-74); advisory in CI.
    ticket(issue_key): ReportPortal attribute ticket=<issue_key> published by pytest-reportportal
    ac(key_acn): ReportPortal attribute ac=<KEY:ACn> published by pytest-reportportal
