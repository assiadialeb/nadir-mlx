# Spectra Quality Gate — CI/CD integration
# Runs on PR→main, push to main, version tags (v*), published releases, or workflow_dispatch.
# Posts a quality summary as a PR comment with a link to the detailed analysis.
#
# Required GitHub configuration:
#   vars.SPECTRA_URL          — Spectra instance URL (e.g. https://spectra.vela-labs.net)
#   secrets.SPECTRA_CI_KEY    — API key from Spectra → Code Analysis → repo Settings
#   secrets.SONAR_TOKEN       — Sonar token (API Client mode; Managed mode uses Spectra token)
#   vars.REPORTPORTAL_URL    — ReportPortal base URL, no trailing slash
#   secrets.REPORTPORTAL_API_KEY — API key that can write to the project "nadir-mlx"
# When the URL variable and the API key are both set, pytest publishes the launch. Otherwise results stay on the runner.
#
# Spectra CI repo must declare sonar_project_key in Code Analysis settings.
name: Spectra Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  release:
    # published = draft→publish or direct publish; released = non-prerelease publish
    types: [published, released]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "PR number (optional — enables Sonar PR analysis and posts a comment on the PR)"
        required: false
        type: string
      reportportal_launch_name:
        description: "Optional ReportPortal launch name (e.g. Release v0.5.0). Empty = auto Tag/Release/…"
        required: false
        type: string

# Dedupe when a Release both creates a tag (push) and publishes (release).
concurrency:
  group: spectra-quality-gate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      CI_PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pull_request_number || '' }}
      CI_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      CI_SCM_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_TRIGGERED_BY: ${{ github.event_name }}
      AGENT_NO_ANALYTICS: "1"
      RP_API_KEY: ${{ secrets.REPORTPORTAL_API_KEY }}
      RP_ENDPOINT: ${{ vars.REPORTPORTAL_URL }}
      RP_PROJECT: nadir-mlx
      RP_LAUNCH: ${{ github.event.inputs.reportportal_launch_name || (github.event_name == 'release' && format('Release {0}', github.event.release.tag_name)) || (startsWith(github.ref, 'refs/tags/') && format('Tag {0}', github.ref_name)) || format('nadir-mlx {0} {1}', github.event_name, github.head_ref || github.ref_name) }}
      RP_LAUNCH_ATTRIBUTES: ci:github;branch:${{ github.head_ref || github.ref_name }};event:${{ github.event_name }};commit:${{ github.event.pull_request.head.sha || github.sha }}
      RP_LAUNCH_DESCRIPTION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # MLX/mflux are Apple Silicon–only; CI runs on ubuntu-latest with import stubs.
          grep -vE '^(mlx|mlx-|mflux)' requirements.txt | grep -v '^#' | grep -v '^[[:space:]]*$' > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          # mflux is pure-Python metadata for image profiles; avoid mlx CUDA wheels on Linux.
          pip install "mflux==0.18.0" --no-deps
          # --no-deps skips mflux transitive deps; platformdirs is required at import time.
          pip install "platformdirs>=4.0,<5.0" "toml>=0.10.2,<1.0" "piexif>=1.1.3,<2.0"
          pip install -r requirements-test.txt

      - name: OpenAPI contract tests (MLX-72)
        run: |
          export DJANGO_SETTINGS_MODULE=mlx_orchestrator.settings
          export MLX_DISABLE_INSTANCE_WATCHDOG=1
          export NADIR_CI_STUB_MLX=1
          pytest -m contract orchestrator/tests/contracts -q

      - name: Run unit tests with coverage
        run: |
          export DJANGO_SETTINGS_MODULE=mlx_orchestrator.settings
          export MLX_DISABLE_INSTANCE_WATCHDOG=1
          export NADIR_CI_STUB_MLX=1
          if [ -n "$RP_API_KEY" ] && [ -n "$RP_ENDPOINT" ]; then
            pytest orchestrator/tests --cov=. --cov-report=xml:coverage.xml --reportportal
          else
            echo "ReportPortal URL or API key is unset; test results stay on the runner."
            pytest orchestrator/tests --cov=. --cov-report=xml:coverage.xml
          fi

      - name: Verify coverage report for Sonar
        run: |
          if [ ! -f coverage.xml ]; then
            echo "coverage.xml is missing — Sonar will not receive coverage."
            exit 1
          fi
          echo "coverage.xml size: $(wc -c < coverage.xml) bytes"
          if grep -qE '<source>/|<class filename="/' coverage.xml; then
            echo "WARNING: absolute paths detected in coverage.xml; Sonar may fail to match files."
            head -20 coverage.xml
          fi
          covered_files=$(grep -c '<class ' coverage.xml || true)
          echo "Cobertura classes in report: $covered_files"
          if ! grep -qE 'filename="(orchestrator|mlx_orchestrator)/' coverage.xml; then
            echo "WARNING: coverage.xml paths may not match Sonar (expected orchestrator/ or mlx_orchestrator/ prefix)."
            grep -o 'filename="[^"]*"' coverage.xml | head -5
          fi

      - name: Spectra quality gate
        id: spectra
        uses: ./.github/actions/spectra-ci
        with:
          spectra-url: ${{ vars.SPECTRA_URL }}
          api-key: ${{ secrets.SPECTRA_CI_KEY }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          commit-sha: ${{ env.CI_SCM_REVISION }}
          branch: ${{ github.head_ref || github.ref_name }}
          pull-request: ${{ env.CI_PR_NUMBER }}
          triggered-by: ${{ env.CI_TRIGGERED_BY }}
          base-ref: ${{ env.CI_BASE_REF }}
          sonar-sources: orchestrator,mlx_orchestrator
          coverage-report: coverage.xml
          scm-revision: ${{ env.CI_SCM_REVISION }}
          sast-mode: pack
          sonar-extra-args: >-
            -Dsonar.tests=orchestrator/tests
            -Dsonar.test.inclusions=**/test_*.py
            -Dsonar.coverage.exclusions=orchestrator/migrations/**,orchestrator/tests/**,manage.py,**/*_server.py,**/mlx_*_launcher.py,orchestrator/mlx_launcher.py,orchestrator/management/commands/migrate_sqlite_to_postgres.py,orchestrator/vendor/**,orchestrator/views.py,orchestrator/ui_selectors.py,orchestrator/registry_builder.py,orchestrator/downloader.py
            -Dsonar.exclusions=orchestrator/migrations/**,orchestrator/static/**,docs/**,site/**,adr/**,models/**,logs/**,venv/**,**/__pycache__/**

      - name: Post PR comment
        if: always() && steps.spectra.outputs.scan_id != '' && env.CI_PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SPECTRA_URL: ${{ vars.SPECTRA_URL }}
          API_KEY: ${{ secrets.SPECTRA_CI_KEY }}
          SCAN_ID: ${{ steps.spectra.outputs.scan_id }}
          VERDICT_STATUS: ${{ steps.spectra.outputs.status }}
        run: |
          DATA=$(curl -sS "$SPECTRA_URL/api/v1/ci/scans/$SCAN_ID/status" \
            -H "X-CI-Key: $API_KEY" | jq '.data // {}' 2>/dev/null)

          STATUS=$(echo "$DATA" | jq -r '.status // "unknown"')
          SCAN_URL=$(echo "$DATA" | jq -r '.scan_url // ""')

          NEW_BUGS=$(echo "$DATA" | jq -r '.new_bugs // 0')
          NEW_VULNS=$(echo "$DATA" | jq -r '.new_vulnerabilities // 0')
          NEW_SMELLS=$(echo "$DATA" | jq -r '.new_code_smells // 0')
          NEW_DUP=$(echo "$DATA" | jq -r '.new_duplication_pct // 0')
          NEW_COV=$(echo "$DATA" | jq -r '.new_coverage // empty')
          TOTAL_COV=$(echo "$DATA" | jq -r '.total_coverage // empty')

          TOTAL_BUGS=$(echo "$DATA" | jq -r '.total_bugs // "—"')
          TOTAL_VULNS=$(echo "$DATA" | jq -r '.total_vulnerabilities // "—"')
          TOTAL_SMELLS=$(echo "$DATA" | jq -r '.total_code_smells // "—"')

          RELIABILITY=$(echo "$DATA" | jq -r '.reliability_rating // "—"')
          MAINTAINABILITY=$(echo "$DATA" | jq -r '.maintainability_rating // "—"')

          if [ -n "$NEW_COV" ]; then
            COVERAGE_LABEL="Coverage on New Code"
            COVERAGE_VALUE="${NEW_COV}%"
          elif [ -n "$TOTAL_COV" ]; then
            COVERAGE_LABEL="Coverage (overall)"
            COVERAGE_VALUE="${TOTAL_COV}%"
          else
            COVERAGE_LABEL="Coverage"
            COVERAGE_VALUE="—"
          fi

          case "$STATUS" in
            passed)   ICON="✅"; LABEL="Quality Gate passed" ;;
            bypassed) ICON="⏭️"; LABEL="Quality Gate bypassed" ;;
            failed)   ICON="❌"; LABEL="Quality Gate failed" ;;
            error)    ICON="⚠️"; LABEL="Quality Gate error" ;;
            *)        ICON="⏳"; LABEL="Quality Gate — $STATUS" ;;
          esac

          FAILED_CONDITIONS=$(echo "$DATA" | jq -r '
            if (.failed_conditions | length) > 0
            then "\n**Failed conditions:**\n" + (.failed_conditions | map("- " + .) | join("\n"))
            else "" end')

          BODY=$(cat <<EOF
          ## $ICON Spectra — $LABEL

          ### Issues

          | | New | Overall |
          |---|:---:|:---:|
          | 🐛 Bugs | **$NEW_BUGS** | $TOTAL_BUGS |
          | 🔒 Vulnerabilities | **$NEW_VULNS** | $TOTAL_VULNS |
          | 🧹 Code Smells | **$NEW_SMELLS** | $TOTAL_SMELLS |

          ### Measures

          | Metric | Value |
          |---|:---:|
          | Duplication on New Code | ${NEW_DUP}% |
          | ${COVERAGE_LABEL} | ${COVERAGE_VALUE} |
          | Reliability | $RELIABILITY |
          | Maintainability | $MAINTAINABILITY |
          $FAILED_CONDITIONS

          ---
          📊 [View detailed analysis on Spectra]($SCAN_URL)
          EOF
          )

          BODY=$(echo "$BODY" | sed 's/^          //')
          gh pr comment "$CI_PR_NUMBER" --body "$BODY"
