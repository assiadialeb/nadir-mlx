# Parallel Sonar comparison analysis (Spectra engine vs SonarQube, SPCTR-290).
# Quality only — no SAST/secrets/SBOM here: those belong to the Spectra runner
# (spectra.yml). Coverage comes from the quality-gate run of the same commit
# in spectra.yml — this job never runs pytest; it fails loudly when the
# artifact is missing (a scan without coverage would wrongly report 0% on
# new code).
name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

env:
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

# actions: read is required to list spectra.yml runs and download its artifact.
permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download coverage from the Spectra quality-gate run
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ARTIFACT: coverage-${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            run_id=$(gh run list --workflow=spectra.yml --branch "$BRANCH" \
              --json databaseId,headSha --limit 30 \
              --jq "[.[] | select(.headSha == \"${HEAD_SHA}\") | .databaseId] | max // 0")
            if [ "$run_id" != "0" ] && gh run download "$run_id" --name "$ARTIFACT" --dir . 2>/dev/null; then
              echo "Downloaded ${ARTIFACT} from run ${run_id}."
              break
            fi
            # Do not wait for an artifact that will never come: when the latest
            # spectra.yml run for this commit already failed, fail fast too.
            conclusion=$(gh run list --workflow=spectra.yml --branch "$BRANCH" \
              --json headSha,conclusion --limit 30 \
              --jq "[.[] | select(.headSha == \"${HEAD_SHA}\") | .conclusion] | last // \"pending\"")
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
              echo "::error::spectra.yml run for ${HEAD_SHA} ended with '${conclusion}' — no coverage artifact will be produced."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Artifact ${ARTIFACT} not found after 30 minutes — the spectra.yml quality-gate run produced no coverage.xml for commit ${HEAD_SHA}."
              exit 1
            fi
            echo "Waiting for ${ARTIFACT} (quality-gate run ${run_id:-none} on ${BRANCH})..."
            sleep 30
          done
          test -s coverage.xml || { echo "::error::Downloaded coverage.xml is empty."; exit 1; }

      # Same properties as the spectra-ci action (run-sonar.sh) so both analyses
      # stay comparable: sources, tests, exclusions, PR decoration, new-code ref.
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=assiadialeb_nadir_mlx
            -Dsonar.python.version=3.12
            -Dsonar.sources=orchestrator,mlx_orchestrator
            -Dsonar.tests=orchestrator/tests
            -Dsonar.test.inclusions=**/test_*.py
            -Dsonar.coverage.exclusions=orchestrator/migrations/**,orchestrator/tests/**,manage.py,**/*_server.py,**/mlx_*_launcher.py,orchestrator/mlx_launcher.py,orchestrator/management/commands/migrate_sqlite_to_postgres.py,orchestrator/vendor/**,orchestrator/views.py,orchestrator/ui_selectors.py,orchestrator/registry_builder.py,orchestrator/downloader.py
            -Dsonar.exclusions=orchestrator/migrations/**,orchestrator/static/**,docs/**,site/**,adr/**,models/**,logs/**,venv/**,**/__pycache__/**
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.newCode.referenceBranch=${{ github.base_ref }}

      # Quality Gate is enforced by Spectra (quality-gate job); this workflow stays advisory.
      # - uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
